name: Test Suite 1

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-jdk8:
    name: Build with JDK 8
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Set env
      run: echo "RELADOMO_JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV
    - name: Build with Ant via shell script
      run: ./build/build.sh reladomo-test-suite1
      
  build-jdk21:
    name: Build with JDK 21
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 21
      uses: actions/setup-java@v1
      with:
        java-version: 21
    - name: Set env
      run: echo "RELADOMO_JDK_HOME=$JAVA_HOME" >> $GITHUB_ENV
    - name: Build with Ant via shell script
      run: ./build/build.sh reladomo-test-suite1
